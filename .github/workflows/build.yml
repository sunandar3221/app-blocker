name: Build App Blocker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (C++ Native NDK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          echo "Setting up Android SDK licenses and NDK..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "Installing NDK..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" || true
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" || true
          fi
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK for Artifact & Release
        id: prepare-apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Raw APK: $RAW_APK"
          cp "$RAW_APK" AppBlocker-v2.0.1.apk
          cp "$RAW_APK" AppBlocker.apk
          echo "apk_path=AppBlocker-v2.0.1.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppBlocker-v2.0.1-apk
          path: AppBlocker-v2.0.1.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: "App Blocker v2.0.1 (Update Test Release)"
          body: |
            ### 🚀 App Blocker v2.0.1 (Pembaruan Tersedia)

            Pembaruan sistem Kiosk Mode & verifikasi In-App Update.

            **Catatan Rilis v2.0.1:**
            - 🚀 Peningkatan stabilitas pembaruan in-app via GitHub Releases.
            - 🔄 Optimalisasi pemulihan Kiosk Mode saat HP menyala ulang (*boot completed*).
            - 🛡️ Pengamanan background activity & overlay lockscreen.

            **Unduh APK Langsung:**
            Unduh file **AppBlocker-v2.0.1.apk** di bawah.
          files: |
            AppBlocker-v2.0.1.apk
            AppBlocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
