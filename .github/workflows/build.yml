name: Build App Blocker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (C++ Native NDK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          echo "Setting up Android SDK licenses and NDK..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "Installing NDK..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" || true
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" || true
          fi
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f "keystore/app-release.jks" ]; then
            echo "Generating persistent signing keystore..."
            keytool -genkeypair -v \
              -keystore keystore/app-release.jks \
              -alias appblocker \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "appblocker_secure_key_2026" \
              -keypass "appblocker_secure_key_2026" \
              -dname "CN=AppBlocker, OU=Kiosk, O=AppBlocker, L=Jakarta, ST=Jakarta, C=ID"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/app-release.jks
            git commit -m "ci: persist release keystore to eliminate package signature conflict" || true
            git push origin main || true
          fi

      - name: Build Debug APK (Signed with Persistent Keystore)
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK for Artifact & Release
        id: prepare-apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Raw APK: $RAW_APK"
          cp "$RAW_APK" AppBlocker-v2.0.7.apk
          cp "$RAW_APK" AppBlocker.apk
          echo "apk_path=AppBlocker-v2.0.7.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppBlocker-v2.0.7-apk
          path: AppBlocker-v2.0.7.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.7
          name: "App Blocker v2.0.7 (Dedicated LockTaskMode Kiosk & Zero Accessibility)"
          body: |
            ### 🚀 App Blocker v2.0.7 (Peralihan Penuh ke LockTaskMode Tanpa Aksesibilitas)

            Pembaruan arsitektur besar sesuai permintaan pengguna: Mengeliminasi layanan Aksesibilitas sepenuhnya dan beralih 100% ke **Lock Task Mode (Kiosk Mode Resmi Android)**:

            **Pembaruan v2.0.7:**
            - 🚫 **Bebas Aksesibilitas (Zero Accessibility):** Izin Aksesibilitas tidak lagi dibutuhkan sama sekali! Tidak ada lagi masalah izin mati sendiri, crash watchdog, atau lag sistem operasi.
            - 🔒 **Dedicated Lock Task Mode:** Memanfaatkan API resmi `startLockTask()` dan integrasi `DevicePolicyManager`. Sistem operasi Android mengunci layar secara resmi di level kernel/framework. Tombol Beranda, Recents, dan notifikasi terkunci total.
            - 🛡️ **Enterprise Device Owner Support:** Mendukung pendaftaran `setLockTaskPackages()` bagi perangkat yang menjalankan Device Owner untuk penguncian 100% hening tanpa dialog sistem.
            - 📱 **UI Sederhana & Cepat:** Antarmuka hanya memerlukan Device Admin + Overlay. Tombol "Mulai Kiosk Mode" langsung aktif tanpa harus repot menyalakan Aksesibilitas di pengaturan HP.
            - 🔓 **Clean Unlock:** Pelepasan mode sematan (`stopLockTask()`) otomatis saat PIN yang benar dimasukkan.
            - 📲 **In-App Update:** Update langsung melalui tombol Cek Pembaruan di aplikasi.

            **Unduh APK:**
            Unduh file **AppBlocker-v2.0.7.apk** di bawah ini.
          files: |
            AppBlocker-v2.0.7.apk
            AppBlocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
