name: Build App Blocker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (C++ Native NDK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          echo "Setting up Android SDK licenses and NDK..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "Installing NDK..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" || true
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" || true
          fi
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK for Artifact & Release
        id: prepare-apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Raw APK: $RAW_APK"
          cp "$RAW_APK" AppBlocker-v2.0.0.apk
          cp "$RAW_APK" AppBlocker.apk
          echo "apk_path=AppBlocker-v2.0.0.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppBlocker-v2.0.0-apk
          path: AppBlocker-v2.0.0.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "App Blocker v2.0.0 (Boot Persistence & In-App Auto Update)"
          body: |
            ### 🚀 App Blocker v2.0.0 (Major Release)

            Aplikasi Kiosk Mode Android dengan pengamanan native C++ (NDK).

            **Pembaruan v2.0.0:**
            - 🔄 **Smart Boot Persistence:** Jika HP direstart saat Kiosk Mode aktif, sistem otomatis mendeteksi status dan langsung mengembalikan HP ke Kiosk Mode. Jika Kiosk tidak aktif, HP tetap normal tanpa mengganggu.
            - 🔔 **Sistem Notifikasi & Auto-Update:** Mengecek rilis terbaru langsung dari GitHub Releases, menampilkan dialog konfirmasi, mengunduh, dan memperbarui aplikasi secara mulus tanpa bentrok package.
            - 🔒 **Native C++ Engine:** Salted SHA-256 PIN hashing & dynamic allowed package filter.
            - 🛡️ **Proteksi Kiosk Lengkap:** Device Admin, Accessibility Service, Overlay Bubble, dan Anti-Kill Battery.

            **Unduh APK:**
            Unduh file **AppBlocker-v2.0.0.apk** di bawah.
          files: |
            AppBlocker-v2.0.0.apk
            AppBlocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
