name: Build App Blocker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (C++ Native NDK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          echo "Setting up Android SDK licenses and NDK..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "Installing NDK..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" || true
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" || true
          fi
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Persistent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f "keystore/app-release.jks" ]; then
            echo "Generating persistent signing keystore..."
            keytool -genkeypair -v \
              -keystore keystore/app-release.jks \
              -alias appblocker \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "appblocker_secure_key_2026" \
              -keypass "appblocker_secure_key_2026" \
              -dname "CN=AppBlocker, OU=Kiosk, O=AppBlocker, L=Jakarta, ST=Jakarta, C=ID"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/app-release.jks
            git commit -m "ci: persist release keystore to eliminate package signature conflict" || true
            git push origin main || true
          fi

      - name: Build Debug APK (Signed with Persistent Keystore)
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK for Artifact & Release
        id: prepare-apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Raw APK: $RAW_APK"
          cp "$RAW_APK" AppBlocker-v2.0.6.apk
          cp "$RAW_APK" AppBlocker.apk
          echo "apk_path=AppBlocker-v2.0.6.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppBlocker-v2.0.6-apk
          path: AppBlocker-v2.0.6.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.6
          name: "App Blocker v2.0.6 (KioskGuard Foundation & Official Screen Pinning)"
          body: |
            ### 🚀 App Blocker v2.0.6 (Solusi Permanen Anti-Spam Exit & Fitur Sematkan Aplikasi)

            Pembaruan arsitektur besar untuk menyelesaikan masalah spam tombol keluar dan menambahkan fitur resmi **Sematkan Aplikasi (Screen Pinning / Lock Task)**:

            **Pembaruan v2.0.6:**
            - 🛡️ **KioskGuard Foundation Activity:** Memasang Activity pelindung tetap (`KioskGuardActivity`) di bawah aplikasi yang dikunci. Saat pengguna menekan tombol Kembali secara berulang-ulang hingga aplikasi target `finish()`, layar tidak akan pernah jatuh ke Launcher! Layar jatuh ke `KioskGuardActivity` yang secara otomatis mengembalikan aplikasi target ke depan dalam 0.3 detik.
            - 📌 **Dukungan Resmi Sematkan Aplikasi (Lock Task Mode):** Menambahkan tombol dan otomatisasi `startLockTask()` (Screen Pinning bawaan Android). Saat aktif, sistem operasi Android mengunci layar secara resmi sehingga tombol Beranda, Recents, dan notifikasi terkunci total.
            - ⚡ **Zero Disk I/O & Memory Cache:** Menghilangkan pemanggilan pembacaan file dari Main Thread Accessibility Service sehingga izin Aksesibilitas tidak akan pernah dimatikan oleh Android Watchdog.
            - 🔓 **Clean Unlock:** Melepaskan mode sematan (`stopLockTask()`) dan menutup layanan secara bersih saat PIN yang benar dimasukkan.
            - 📲 **In-App Update:** Update langsung melalui tombol Cek Pembaruan di aplikasi.

            **Unduh APK:**
            Unduh file **AppBlocker-v2.0.6.apk** di bawah ini.
          files: |
            AppBlocker-v2.0.6.apk
            AppBlocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
