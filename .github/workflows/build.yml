name: Build App Blocker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (C++ Native NDK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        run: |
          echo "Installing Android NDK 26.1.10909125 and CMake 3.22.1..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK for Artifact & Release
        id: prepare-apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Raw APK: $RAW_APK"
          cp "$RAW_APK" AppBlocker-v1.0.0.apk
          echo "apk_path=AppBlocker-v1.0.0.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppBlocker-debug-apk
          path: ${{ steps.prepare-apk.outputs.apk_path }}
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "App Blocker v1.0.1 (Bugfix Kiosk & Accessibility)"
          body: |
            ### 🚀 App Blocker (Android Kiosk Mode)

            Aplikasi Kiosk Mode Android dengan pengamanan native C++ (NDK).

            **Fitur:**
            - 🔒 Pemilihan aplikasi target untuk dikunci dalam Kiosk Mode.
            - 🔑 Wajib setel PIN saat pertama kali masuk dan wajib verifikasi PIN untuk keluar Kiosk.
            - 🛡️ Perlindungan ganda: Device Admin + Accessibility Service.
            - ⚡ Native C++ engine: Salted SHA-256 PIN cryptography & whitelist filter.
            - 🎈 Floating bubble trigger untuk kemudahan akses verifikasi keluar Kiosk.

            **Unduh APK:**
            Unduh file **AppBlocker-v1.0.0.apk** di bawah untuk diinstal pada perangkat Android Anda.
          files: AppBlocker-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
